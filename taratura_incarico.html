<!--
  ════════════════════════════════════════════════════════════════════════
  TARATURA DEL MODULO — versione 2                          [10 set 2026]
  ------------------------------------------------------------------------
  COSA CAMBIA RISPETTO ALLA PRIMA VERSIONE, e perché.
  Prima si registrava UN PUNTO per campo. Non basta: un cognome lungo o un
  indirizzo lungo sbordano oltre la riga puntinata, e sul modulo non c'è
  spazio per allargarsi.
  Ora si registra il SEGMENTO — dove comincia e dove finisce la riga. Sapendo
  quanto spazio c'è, la scritta si adatta: parte dal corpo normale e
  rimpicciolisce quanto serve per entrare, fino a un minimo leggibile. È
  quello che fa la mano quando il cognome è lungo.
  Quattro tipi di segno:
    testo      — la scritta sulla riga, che si adatta alla larghezza
    lettera    — un solo carattere in uno spazio stretto (la "o" di "nat…")
    crocetta   — la X dentro un quadratino (un clic solo)
    barratura  — una riga tirata sopra l'alternativa che non vale
  Le posizioni sono in PERCENTUALE della pagina: valgono a qualunque
  ingrandimento e su qualunque schermo. Il lavoro si salva mentre procedi.
  ════════════════════════════════════════════════════════════════════════
-->

  return 0;
}

function vaiPagina(n){
  pagina = n; primoClic = null;
  document.getElementById('foglio').src = (n === 1 ? 'incarico_p1.png' : 'incarico_p2.png');
  document.getElementById('pg1').className = 'pg' + (n === 1 ? ' att' : '');
  document.getElementById('pg2').className = 'pg' + (n === 2 ? ' att' : '');
  idx = primoDaFare();
  disegna();
}

var ETICHETTE = {
  testo: 'Scritta sulla riga - due clic: inizio e fine',
  lettera: 'Una lettera sola - due clic: lo spazio dove entra',
  crocetta: 'Crocetta - un clic al centro del quadratino',
  barratura: 'Barratura - due clic: da dove a dove tirare la riga'
};

function disegna(){
  var c = CAMPI[idx];
  document.getElementById('tipo').textContent = c ? ETICHETTE[tipoDi(c)] : '';
  document.getElementById('nome').textContent = c ? c[1] : '-';
  document.getElementById('desc').textContent = c ? c[3] : '';
  document.getElementById('passo').textContent = !c ? ''
    : (dueClic(c) ? (primoClic ? 'ora clicca la FINE' : 'clicca l\'INIZIO') : 'un clic al centro');

  var diPag = CAMPI.filter(function (x) { return x[2] === pagina; });
  var fatti = diPag.filter(function (x) { return pos[x[0]]; }).length;
  document.getElementById('avanz').textContent = fatti + ' / ' + diPag.length
    + '  ·  totale ' + Object.keys(pos).length + ' / ' + CAMPI.length;
  document.getElementById('btnProva').textContent = modoProva ? 'Torna a tarare' : 'Prova';

  var wrap = document.getElementById('wrap');
  [].slice.call(wrap.querySelectorAll('.seg,.puntoA,.prova')).forEach(function (e) { e.remove(); });
  var r = document.getElementById('foglio').getBoundingClientRect();

  diPag.forEach(function (x) {
    var p = pos[x[0]];
    if (!p) return;
    var corrente = (c && x[0] === c[0]);
    if (p.t === 'crocetta') {
      var d = document.createElement('div');
      d.className = 'puntoA';
      d.style.left = p.x + '%'; d.style.top = p.y + '%';
      if (!corrente) d.style.background = '#15803D';
      wrap.appendChild(d);
    } else {
      var s = document.createElement('div');
      s.className = 'seg' + (corrente ? ' corrente' : '') + (p.t === 'barratura' ? ' barratura' : '');
      s.style.left = p.x + '%'; s.style.top = p.y + '%'; s.style.width = p.w + '%';
      s.innerHTML = '<span class="tag">' + x[0] + '</span>';
      wrap.appendChild(s);
    }
    if (modoProva && p.t !== 'crocetta' && p.t !== 'barratura') {
      var el = document.createElement('div');
      el.className = 'prova';
      el.textContent = x[5] || x[1];
      el.style.left = p.x + '%'; el.style.top = p.y + '%';
      wrap.appendChild(el);
      var largPx = (p.w / 100) * r.width;
      var normale = r.width * (p.t === 'lettera' ? 0.0075 : 0.0078);
      var minimo = r.width * 0.0055;
      var f = normale, giri = 0;
      el.style.fontSize = f + 'px';
      while (el.scrollWidth > largPx && f > minimo && giri < 80) { f -= 0.4; el.style.fontSize = f + 'px'; giri++; }
      var entra = el.scrollWidth <= largPx;
      el.style.color = entra ? '#0F172A' : '#B91C1C';
      el.title = entra ? '' : 'NON CI STA nemmeno al corpo minimo';
    }
  });
}

document.getElementById('wrap').addEventListener('click', function (e) {
  if (modoProva) return;
  var img = document.getElementById('foglio');
  var r = img.getBoundingClientRect();
  var x = ((e.clientX - r.left) / r.width) * 100;
  var y = ((e.clientY - r.top) / r.height) * 100;
  if (x < 0 || x > 100 || y < 0 || y > 100) return;
  var c = CAMPI[idx];
  if (!c) return;
  var t = tipoDi(c);

  if (!dueClic(c)) {
    pos[c[0]] = { p: c[2], t: t, x: +x.toFixed(3), y: +y.toFixed(3) };
    salva(); avanti(); return;
  }
  if (!primoClic) {
    primoClic = { x: x, y: y };
    disegna();
    var d = document.createElement('div');
    d.className = 'puntoA';
    d.style.left = x + '%'; d.style.top = y + '%';
    document.getElementById('wrap').appendChild(d);
    document.getElementById('passo').textContent = 'ora clicca la FINE';
    return;
  }
  var x1 = Math.min(primoClic.x, x), x2 = Math.max(primoClic.x, x);
  /* La riga di scrittura e quella del PRIMO clic: il secondo dice solo dove
     finisce lo spazio, e la mano non e mai perfettamente dritta. */
  pos[c[0]] = { p: c[2], t: t, x: +x1.toFixed(3), y: +primoClic.y.toFixed(3), w: +(x2 - x1).toFixed(3) };
  primoClic = null;
  salva(); avanti();
});

function avanti(){
  for (var i = idx + 1; i < CAMPI.length; i++) if (CAMPI[i][2] === pagina && !pos[CAMPI[i][0]]) { idx = i; disegna(); return; }
  for (var j = 0; j < CAMPI.length; j++) if (CAMPI[j][2] === pagina && !pos[CAMPI[j][0]]) { idx = j; disegna(); return; }
  idx = Math.min(idx + 1, CAMPI.length - 1);
  disegna();
}
function indietro(){
  primoClic = null;
  for (var i = idx - 1; i >= 0; i--) if (CAMPI[i][2] === pagina) { idx = i; disegna(); return; }
}
function salta(){
  primoClic = null;
  for (var i = idx + 1; i < CAMPI.length; i++) if (CAMPI[i][2] === pagina) { idx = i; disegna(); return; }
}
function togglProva(){
  modoProva = !modoProva; primoClic = null;
  document.getElementById('wrap').className = modoProva ? '' : 'attesa';
  disegna();
}

function mostraEsito(){
  var out = { modulo: 'FRIMM incarico vendita', versione: 2, tarato: new Date().toISOString().slice(0, 10), campi: pos };
  document.getElementById('json').value = JSON.stringify(out, null, 1);
  document.getElementById('esito').style.display = 'block';
}
function scarica(){
  var b = new Blob([document.getElementById('json').value], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'posizioni_incarico.json';
  a.click();
}

window.addEventListener('resize', function () { if (modoProva) disegna(); });
vaiPagina(1);
</script>
</body>
</html>
