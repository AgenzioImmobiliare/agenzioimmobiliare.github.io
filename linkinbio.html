<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enzo Carnicelli · Case ad Agropoli e nel Cilento</title>
<meta name="description" content="Immobili in vendita ad Agropoli e nel Cilento, valutazione gratuita della tua casa e contatto diretto su WhatsApp.">
<meta property="og:title" content="Enzo Carnicelli · Case ad Agropoli e nel Cilento">
<meta property="og:description" content="Immobili in vendita, valutazione gratuita e contatto diretto.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0D1B2A">
<link rel="icon" href="icon-192.png">
<style>
/* [4 ott 2026] Link in Bio — pagina pubblica. I dati li pubblica il gestionale
   (o il Marketing Hub) nel documento pubblico/linkinbio: qui si leggono e basta. */
:root{--navy:#0D1B2A;--navy2:#1A3050;--gold:#C9A84C;--gold2:#E0BE60;--crema:#F8F5EF;--testo:#0F172A;--testo2:#475569;--testo3:#94A3B8;--riga:rgba(13,27,42,.1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--testo);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.pag{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* [4 ott 2026] banner "Luci e griglia" scelto da Enzo: blu notte, due luci
   sfumate (blu in alto a sinistra, oro in basso a destra), griglia leggera
   che sfuma verso il basso, avatar oro con alone */
.testa{position:relative;overflow:hidden;background:#0B1626;color:#fff;text-align:center;padding:40px 20px 30px;border-radius:0 0 30px 30px}
.testa::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.75),transparent 65%);top:-180px;left:-120px}
.testa::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.6),transparent 65%);bottom:-200px;right:-130px}
.testa .griglia{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
.testa>*{position:relative;z-index:1}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#B08A2E);color:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.6rem;font-weight:800;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 40px rgba(224,190,96,.45)}
.nome{font-size:1.3rem;font-weight:800;letter-spacing:-.3px}
.agz{font-size:.74rem;color:var(--gold2);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.intro{font-size:.86rem;color:rgba(255,255,255,.8);margin-top:8px;line-height:1.45}
.pill{display:inline-flex;gap:7px;align-items:center;margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:6px 13px;font-size:.74rem;font-weight:600;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill i{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 8px #22C55E}
.pill[hidden]{display:none}
.corpo{padding:18px 16px 10px;display:flex;flex-direction:column;gap:10px;flex:1}
.bt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--riga);border-radius:14px;padding:13px 14px;box-shadow:0 2px 8px rgba(13,27,42,.05);transition:transform .12s,box-shadow .12s}
.bt:active{transform:scale(.985)}
.bt .ic{width:40px;height:40px;border-radius:11px;background:#F1EBDD;color:#8A6D1F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bt .tx{flex:1;min-width:0}.bt b{display:block;font-size:.95rem}.bt span{display:block;font-size:.76rem;color:var(--testo2);margin-top:1px}
.bt .fr{color:var(--testo3);flex-shrink:0}
.bt.wa{background:#15803D;border-color:#15803D;color:#fff}.bt.wa .ic{background:rgba(255,255,255,.18);color:#fff}.bt.wa span,.bt.wa .fr{color:rgba(255,255,255,.85)}
.bt.prim{background:var(--navy);border-color:var(--navy);color:#fff}.bt.prim .ic{background:var(--gold);color:var(--navy)}.bt.prim span,.bt.prim .fr{color:rgba(255,255,255,.75)}
.sez{display:flex;align-items:baseline;gap:8px;margin:14px 2px 2px}.sez b{font-size:1rem}.sez span{font-size:.78rem;color:var(--testo2)}
.ims{display:grid;grid-template-columns:1fr;gap:12px}
.im{background:#fff;border:1px solid var(--riga);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(13,27,42,.06);display:block}
.im .ft{aspect-ratio:16/10;background:#E8E2D4 center/cover no-repeat;position:relative}
.im .pr{position:absolute;left:10px;bottom:10px;background:rgba(13,27,42,.88);color:#fff;font-weight:800;font-size:.9rem;padding:5px 10px;border-radius:9px}
.im .rf{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);color:var(--navy);font-weight:700;font-size:.68rem;padding:3px 8px;border-radius:20px}
.im .in{padding:11px 13px 12px}.im b{display:block;font-size:.95rem}.im span{display:block;font-size:.78rem;color:var(--testo2);margin-top:2px}
.im .az{display:flex;gap:8px;margin-top:10px}
.im .az em{flex:1;text-align:center;font-style:normal;font-size:.8rem;font-weight:700;border-radius:9px;padding:8px 0;border:1px solid var(--riga);color:var(--navy)}
.im .az em.w{background:#15803D;border-color:#15803D;color:#fff}
.ev{background:#fff;border:1px solid var(--riga);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(13,27,42,.06);display:flex;flex-direction:column}
.ev .top{display:flex;gap:12px;padding:12px}
.ev .ft{width:84px;height:84px;border-radius:12px;flex-shrink:0;background:linear-gradient(140deg,var(--navy),var(--navy2)) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)}
.ev .dt{position:absolute;left:6px;top:6px;background:#fff;border-radius:8px;padding:3px 7px;text-align:center;line-height:1.05;color:var(--navy);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.ev .dt b{display:block;font-size:1rem}.ev .dt span{font-size:.58rem;font-weight:800;text-transform:uppercase;color:#A8842A}
.ev .tx{flex:1;min-width:0}.ev .et{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#B45309;border-radius:20px;padding:2px 8px}
.ev .tx span.et{display:inline-block;margin-top:0;color:#fff;font-size:.62rem}
.ev .tx b{display:block;font-size:.95rem;margin-top:4px;line-height:1.25}.ev .tx span{display:block;font-size:.76rem;color:var(--testo2);margin-top:2px}
.ev .az{display:flex;gap:8px;padding:0 12px 12px}
.ev .az a{flex:1;text-align:center;font-size:.8rem;font-weight:700;border-radius:9px;padding:8px 0;border:1px solid var(--riga);color:var(--navy)}
.ev .az a.w{background:#15803D;border-color:#15803D;color:#fff}
.piede{text-align:center;font-size:.72rem;color:var(--testo3);padding:18px 16px 28px;line-height:1.6}
.carica{height:64px;border-radius:14px;background:linear-gradient(90deg,#EFEAE0 0%,#F7F3EA 50%,#EFEAE0 100%);background-size:200% 100%;animation:sc 1.2s infinite}
@keyframes sc{0%{background-position:200% 0}100%{background-position:-200% 0}}
.avviso{font-size:.84rem;color:var(--testo2);text-align:center;padding:10px}
.im{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;padding:0}
/* [5 ott 2026] mini-scheda dell'immobile dentro la pagina (scelta di Enzo):
   la X è nostra e torna all'elenco; anche il tasto/gesto Indietro la chiude */
.sk{position:fixed;inset:0;z-index:50;background:rgba(11,22,38,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.sk.on{display:flex}
.sk-box{position:relative;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--crema);border-radius:22px 22px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.35);animation:su .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sk-ft{aspect-ratio:4/3;background:#E8E2D4 center/cover no-repeat;position:relative;border-radius:22px 22px 0 0}
.sk-x{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:2}
.sk-ft .pr{position:absolute;left:14px;bottom:14px;background:rgba(13,27,42,.9);color:#fff;font-weight:800;font-size:1.1rem;padding:7px 12px;border-radius:10px}
.sk-ft .rf{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);color:var(--navy);font-weight:700;font-size:.72rem;padding:4px 9px;border-radius:20px}
.sk-in{padding:16px 16px 18px}
.sk-in h2{margin:0;font-size:1.2rem;letter-spacing:-.2px}
.sk-ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sk-ch span{background:#fff;border:1px solid var(--riga);border-radius:20px;padding:5px 11px;font-size:.78rem;font-weight:600;color:var(--testo2)}
.sk-az{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sk-az a,.sk-az button{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px;font:700 .92rem inherit;font-family:inherit;border:1px solid var(--riga);background:#fff;color:var(--navy);cursor:pointer}
.sk-az .w{background:#15803D;border-color:#15803D;color:#fff}
.sk-az .n{background:var(--navy);border-color:var(--navy);color:#fff}
.sk-nota{font-size:.72rem;color:var(--testo3);text-align:center;margin-top:12px}
@media (min-width:700px){.ims{grid-template-columns:1fr 1fr}.im .ft{aspect-ratio:4/3}.sk{align-items:center}.sk-box{border-radius:22px}}
@media (prefers-reduced-motion:reduce){.carica{animation:none}.bt{transition:none}}
</style>
</head>
<body>
<div class="pag">
  <header class="testa">
    <div class="griglia"></div>
    <div class="av" id="av">EC</div>
    <div class="nome" id="nome">Enzo Carnicelli</div>
    <div class="agz" id="agz">Agropoli · Cilento</div>

  </header>
  <main class="corpo" id="corpo">
    <div class="carica"></div><div class="carica"></div><div class="carica"></div>
  </main>
  <footer class="piede" id="piede">Agropoli · Cilento</footer>
</div>
<div class="sk" id="sk" role="dialog" aria-modal="true" aria-label="Scheda immobile"><div class="sk-box" id="skBox"></div></div>
<script src="lib-pubblica.js?v=20261005B"></script>
<script>
(function(){
  var ICO = {
    valuta:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>',
    quiz:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    sito:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>',
    extra:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/></svg>',
    wa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-12.2 7.5L3 21l2-5.6A8.4 8.4 0 1121 11.5z"/></svg>',
    x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    share:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
    fr:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
  };
  function e(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function link(u){ return /^https?:\/\//.test(u || '') ? u : '#'; }
  /* [5 ott 2026] solo WhatsApp si apre a parte (apre l'app); il resto nella stessa
     pagina, così "Indietro" torna qui invece di lasciare una finestra senza ritorno */
  function dove(u){ return /^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(u || '') ? ' target="_blank" rel="noopener"' : ''; }
  function disegna(p){
    var nome = p.agente || 'Enzo Carnicelli';
    document.getElementById('nome').textContent = nome;
    document.getElementById('av').textContent = nome.split(/\s+/).slice(0, 2).map(function(x){ return x.charAt(0); }).join('').toUpperCase();
    document.getElementById('agz').textContent = p.agenzia || '';
    document.getElementById('intro').textContent = p.intro || '';
    document.title = nome + ' · ' + (p.intro || 'Case ad Agropoli e nel Cilento');
    var h = '';
    /* [4 ott 2026] prossimi eventi in evidenza sotto il banner */
    var EV = window.LIB.eventiValidi ? window.LIB.eventiValidi(p).slice(0, 3) : [];
    if(EV.length){
      h += '<div class="sez" style="margin-top:2px"><b>Prossimi eventi</b></div>';
      EV.forEach(function(ev){
        var d = /^\d{4}-\d{2}-\d{2}$/.test(ev.data || '') ? new Date(ev.data + 'T12:00:00') : null;
        var giorno = d ? d.toLocaleDateString('it-IT', { weekday:'short', day:'numeric', month:'short' }) : '';
        var fino = /^\d{4}-\d{2}-\d{2}$/.test(ev.dataA || '') && ev.dataA !== ev.data ? 'fino al ' + window.LIB.dataIT(ev.dataA) : '';
        h += '<div class="ev"><div class="top"><div class="ft"' + (/^https:\/\//.test(ev.foto || '') ? ' style="background-image:url(\'' + e(ev.foto).replace(/'/g, '%27') + '\')"' : '') + '>'
          + (d ? '<span class="dt"><b>' + d.getDate() + '</b><span>' + e(d.toLocaleDateString('it-IT', { month:'short' }).replace('.', '')) + '</span></span>' : ICO.extra) + '</div>'
          + '<div class="tx"><span class="et">' + e(ev.et || 'Evento') + '</span><b>' + e(ev.t) + '</b><span>' + e([giorno, ev.ore, fino].filter(Boolean).join(' · ')) + '</span>'
          + (ev.luogo ? '<span>' + e(ev.luogo) + '</span>' : '') + (ev.s ? '<span>' + e(ev.s) + '</span>' : '') + '</div></div>'
          + '<div class="az">' + (/^https:\/\//.test(ev.wa || '') ? '<a class="w" href="' + e(ev.wa) + '" target="_blank" rel="noopener">' + (ev.k === 'oh' ? 'Prenota su WhatsApp' : 'Chiedi su WhatsApp') + '</a>' : '')
          + (/^https?:\/\//.test(ev.url || '') ? '<a href="' + e(ev.url) + '"' + dove(ev.url) + '>Vedi l\'immobile</a>' : '') + '</div></div>';
      });
    }
    (p.fissi || []).forEach(function(b, n){
      var cl = b.k === 'wa' ? ' wa' : (n === 0 && b.k === 'valuta' ? ' prim' : '');
      h += '<a class="bt' + cl + '" href="' + e(link(b.url)) + '"' + dove(b.url) + '><span class="ic">' + (ICO[b.k] || ICO.extra) + '</span>'
        + '<span class="tx"><b>' + e(b.t) + '</b>' + (b.s ? '<span>' + e(b.s) + '</span>' : '') + '</span><span class="fr">' + ICO.fr + '</span></a>';
    });
    var I = p.immobili || [];
    if(I.length){
      h += '<div class="sez"><b>In vendita adesso</b><span>' + I.length + (I.length === 1 ? ' immobile' : ' immobili') + '</span></div><div class="ims">';
      I.forEach(function(im){
        h += '<button type="button" class="im" data-id="' + e(im.id || im.ref) + '">'
          + '<div class="ft"' + (im.foto ? ' style="background-image:url(\'' + e(im.foto).replace(/'/g, '%27') + '\')"' : '') + '>'
          + (im.prezzo ? '<span class="pr">' + e(im.prezzo) + '</span>' : '') + (im.ref ? '<span class="rf">Ref. ' + e(im.ref) + '</span>' : '') + '</div>'
          + '<div class="in"><b>' + e(im.titolo) + '</b>' + (im.dett ? '<span>' + e(im.dett) + '</span>' : '')
          + '<div class="az"><em>Vedi la scheda</em></div></div></button>';
      });
      h += '</div>';
    }
    document.getElementById('corpo').innerHTML = h;
    IMM = I; PAG = p;
    Array.prototype.forEach.call(document.querySelectorAll('.im[data-id]'), function(b){ b.onclick = function(){ apri(b.getAttribute('data-id'), true); }; });
    var m = /^#imm-(.+)$/.exec(location.hash); if(m) apri(decodeURIComponent(m[1]), false);
    /* pallino verde nel banner: solo se c'è il numero WhatsApp */
    var wa = (p.fissi || []).filter(function(b){ return b.k === 'wa'; })[0], pill = document.getElementById('pill');
    if(wa && /^https:\/\//.test(wa.url || '')){ pill.href = wa.url; pill.hidden = false; } else pill.hidden = true;
    document.getElementById('piede').innerHTML = e(p.agenzia || '') + '<br>' + e(nome) + ' · Agropoli · Cilento';
  }
  function riserva(msg){
    document.getElementById('intro').textContent = 'Agente immobiliare ad Agropoli e nel Cilento';
    document.getElementById('corpo').innerHTML = '<a class="bt prim" href="valuta-casa.html"><span class="ic">' + ICO.valuta + '</span><span class="tx"><b>Quanto vale la tua casa?</b><span>Test gratuito in 2 minuti</span></span><span class="fr">' + ICO.fr + '</span></a>'
      + '<a class="bt" href="https://www.agenziocilento.it"><span class="ic">' + ICO.sito + '</span><span class="tx"><b>Tutti gli immobili</b><span>www.agenziocilento.it</span></span><span class="fr">' + ICO.fr + '</span></a>'
      + (msg ? '<div class="avviso">' + e(msg) + '</div>' : '');
  }
  /* ── mini-scheda ── */
  var IMM = [], PAG = {}, sk = document.getElementById('sk'), skBox = document.getElementById('skBox'), aperta = false;
  function trovaImm(id){ for(var i = 0; i < IMM.length; i++){ if(String(IMM[i].id || IMM[i].ref) === String(id) || String(IMM[i].ref) === String(id)) return IMM[i]; } return null; }
  function apri(id, nuova){
    var im = trovaImm(id); if(!im) return;
    var annuncio = /^https?:\/\//.test(im.url || '') && im.url !== im.wa && !/^https:\/\/wa\.me\//.test(im.url) ? im.url : '';
    var chips = String(im.dett || '').split(' · ').filter(Boolean);
    skBox.innerHTML = '<div class="sk-ft"' + (im.foto ? ' style="background-image:url(\'' + e(im.foto).replace(/'/g, '%27') + '\')"' : '') + '>'
      + '<button class="sk-x" id="skX" aria-label="Chiudi e torna all\'elenco">' + ICO.x + '</button>'
      + (im.ref ? '<span class="rf">Ref. ' + e(im.ref) + '</span>' : '') + (im.prezzo ? '<span class="pr">' + e(im.prezzo) + '</span>' : '') + '</div>'
      + '<div class="sk-in"><h2>' + e(im.titolo) + '</h2>'
      + (chips.length ? '<div class="sk-ch">' + chips.map(function(c){ return '<span>' + e(c) + '</span>'; }).join('') + '</div>' : '')
      + '<div class="sk-az">'
      + (/^https:\/\//.test(im.wa || '') ? '<a class="w" href="' + e(im.wa) + '" target="_blank" rel="noopener">' + ICO.wa + 'Chiedi informazioni su WhatsApp</a>' : '')
      + (annuncio ? '<a class="n" href="' + e(annuncio) + '">Vedi l\'annuncio completo ' + ICO.fr + '</a>' : '')
      + '<button type="button" id="skShare">' + ICO.share + 'Condividi questo immobile</button>'
      + '</div>' + (annuncio ? '<div class="sk-nota">' + (IN_APP ? 'L\'annuncio si apre nel browser del telefono: questa pagina resta aperta qui in ' + IN_APP + '.' : 'L\'annuncio completo si apre qui: con "Indietro" torni a questa pagina.') + '</div>' : '') + '</div>';
    document.getElementById('skX').onclick = chiudi;
    document.getElementById('skShare').onclick = function(){
      var url = location.href.split('#')[0] + '#imm-' + encodeURIComponent(im.ref || im.id), txt = im.titolo + (im.prezzo ? ' · ' + im.prezzo : '');
      if(navigator.share) navigator.share({ title:im.titolo, text:txt, url:url }).catch(function(){});
      else { try { navigator.clipboard.writeText(url); this.textContent = 'Link copiato'; } catch(_){} }
    };
    sk.classList.add('on'); document.body.style.overflow = 'hidden'; skBox.scrollTop = 0; aperta = true;
    /* una voce nella cronologia: il gesto/tasto Indietro chiude la scheda invece di uscire */
    if(nuova){ try { history.pushState({ sk:1 }, '', '#imm-' + encodeURIComponent(im.ref || im.id)); } catch(_){} }
  }
  function nascondi(){ sk.classList.remove('on'); document.body.style.overflow = ''; aperta = false; }
  function chiudi(){
    if(history.state && history.state.sk) history.back();          /* aperta da qui: torno indietro di un passo */
    else { nascondi(); try { history.replaceState(null, '', location.pathname + location.search); } catch(_){} }   /* aperta da un link condiviso */
  }
  window.addEventListener('popstate', function(){ if(aperta && !/^#imm-/.test(location.hash)) nascondi(); else { var m = /^#imm-(.+)$/.exec(location.hash); if(m && !aperta) apri(decodeURIComponent(m[1]), false); } });
  sk.addEventListener('click', function(ev){ if(ev.target === sk) chiudi(); });
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && aperta) chiudi(); });

  /* [5 ott 2026] Dentro Facebook o Instagram la X in alto è dell'app e chiude tutto:
     i link verso ALTRI siti (annuncio FRIMM, sito) si aprono nel browser vero del
     telefono, così Link in Bio resta aperta nell'app. Se il telefono non lo permette,
     dopo un attimo si apre come prima, nella stessa pagina. */
  var UA = navigator.userAgent || '';
  var IN_APP = /Instagram/i.test(UA) ? 'Instagram' : (/FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(UA) ? 'Facebook' : '');
  function apriFuori(url){
    var android = /Android/i.test(UA), ios = /iPhone|iPad|iPod/i.test(UA), dest = '';
    if(android) dest = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=' + (/^http:/.test(url) ? 'http' : 'https') + ';package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
    else if(ios) dest = 'x-safari-' + url;            /* apre Safari (iPhone con iOS 17 o più recente) */
    if(!dest){ location.href = url; return; }
    var uscito = false, segna = function(){ if(document.visibilityState === 'hidden') uscito = true; };
    document.addEventListener('visibilitychange', segna);
    location.href = dest;
    setTimeout(function(){ document.removeEventListener('visibilitychange', segna); if(!uscito && document.visibilityState === 'visible') location.href = url; }, 1600);
  }
  document.addEventListener('click', function(ev){
    if(!IN_APP) return;
    var a = ev.target.closest && ev.target.closest('a[href]'); if(!a) return;
    var u; try { u = new URL(a.href, location.href); } catch(_){ return; }
    if(!/^https?:$/.test(u.protocol) || u.host === location.host || /(^|\.)wa\.me$|whatsapp\.com$/.test(u.hostname)) return;
    ev.preventDefault(); apriFuori(u.href);
  }, true);

  if(!window.LIB){ riserva(''); return; }
  window.LIB.leggi().then(disegna).catch(function(err){ console.warn('[Link in Bio]', err); riserva(''); });
})();
</script>
